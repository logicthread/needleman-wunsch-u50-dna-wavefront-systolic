# 3968 PE = 31 tiles x 128, SINGLE CONTROL BUNDLE.
# 31 direction ports + 1 merged control bundle = 32 connections.
#
# WHY 32 AND NOT 33 (job 105691, NOTES N49): the HMSS exposes 33 AXI slave ports and the
# SHELL CLAIMS ONE for host access to HBM, so the kernel budget is 32. Asking for 33 dies
# 30 min into the link with "[hbm_memory_subsystem 1-1] You have run out of port
# connections on /hmss_0. All 33 connections are used". Measured: 29 links, 33 fails,
# 37 fails. Do not raise this.
#
# Each dir port carries 1.6 bits/cell (base-3) = 7.68 GB/s, inside one pseudo-channel's
# 9.88 GB/s, so one PC per port. Here `mem` gets HBM[31] to ITSELF, so every channel
# carries exactly one master -- the 4096 cfg had mem and d00 sharing HBM[0].
#
# SECTION ORDER MATTERS: every sp= must sit under [connectivity]. Generating this file by
# stripping sp= lines and appending them landed them under [vivado], and v++ rejected the
# whole file with "60-1520 failed with a parsing error" (job 105697).

[connectivity]
nk=nw_tile_u50:1:nw_tile_u50_1
# S1t (on-card traceback, 2026-10-30): mem spans HBM[0:31] so the ONE control port can
# READ every direction buffer through the HBM switch after the alignment. Still 32 AXI
# masters (31 dir + mem); only mem's address range widens.
sp=nw_tile_u50_1.mem:HBM[0:31]
sp=nw_tile_u50_1.d00:HBM[0]
sp=nw_tile_u50_1.d01:HBM[1]
sp=nw_tile_u50_1.d02:HBM[2]
